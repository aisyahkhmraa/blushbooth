<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300;1,400;1,500&family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap"
      rel="stylesheet"
    />
    <!-- css -->
    <link rel="stylesheet" href="css/edit.css" />
    <!-- favicon -->
    <link rel="icon" href="assets/icons/favicon.png" type="image/png" />
    <title>BlushBooth</title>
  </head>
  <body>
    <header>
      <div class="navigation">
        <p>BlushBooth</p>
        <nav>
          <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="#">About</a></li>
            <li><a href="#">Contact</a></li>
          </ul>
        </nav>
        <a
          href="https://github.com/aisyahkhmraa"
          class="logo-github"
          target="_blank"
          rel="noopener noreferrer"
        >
          <img src="assets/icons/github.png" alt="My Github" />
        </a>
      </div>
      <main>
        <div class="title">
          <h2>
            Customize your
            <span style="font-weight: 700; font-style: italic; color: #679e86"
              >photo.</span
            >
          </h2>
        </div>
        <section class="card">
          <div class="preview-photo">
            <p id="sub-title">Preview</p>
            <canvas id="previewCanvas"></canvas>
          </div>
          <div class="frame-edit">
            <div class="customize-color">
              <p id="sub-title">Frame Color</p>
              <div id="color" class="color-options">
                <button class="color-option"></button>
                <button class="color-option"></button>
                <button class="color-option"></button>
                <button class="color-option"></button>
                <button class="color-option"></button>
                <button class="color-option"></button>
              </div>
              <p id="sub-title">Frame Template</p>
              <div id="template"></div>
            </div>
          </div>
        </section>
        <div class="button">
          <button id="dateButton">Add date</button>
          <button id="downloadButton">DOWNLOAD</button>
        </div>
      </main>
      <footer></footer>
    </header>
  </body>
</html>
